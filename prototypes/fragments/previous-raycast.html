@media(max-width:850px){#app-transfer-preview .at-titlebar{padding-right:92px;gap:9px}#app-transfer-preview .at-identity{gap:12px}#app-transfer-preview .at-account-button>span{display:none}#app-transfer-preview .at-library{width:194px}#app-transfer-preview .at-device-nav button{display:none}#app-transfer-preview .at-task{grid-template-columns:minmax(100px,1fr) minmax(140px,1.5fr) minmax(130px,1fr) 22px;gap:7px}}
@media(max-width:600px){#app-transfer-preview .at-titlebar{flex-wrap:wrap;padding:12px 92px 11px 12px;justify-content:start;gap:12px}#app-transfer-preview .at-traffic{display:none}#app-transfer-preview .at-tabs{margin-left:auto}#app-transfer-preview .at-tabs button{padding:4px 8px}#app-transfer-preview .at-account-button{margin-left:auto}#app-transfer-preview .at-toolbar{padding:7px 9px;gap:5px}#app-transfer-preview .at-connected{font-size:10px}#app-transfer-preview .at-workspace{display:block}#app-transfer-preview .at-library{width:100%;padding:14px 10px;border-right:0;border-bottom:1px solid var(--at-line)}#app-transfer-preview .at-library-list{display:flex;flex-wrap:wrap;min-height:0}#app-transfer-preview .at-library-list .at-app-row{width:50%;min-width:130px}#app-transfer-preview .at-library-drop{padding:9px;margin:9px 0 0;flex-direction:row;justify-content:center;gap:10px;font-size:11px}#app-transfer-preview .at-library-drop br{display:none}#app-transfer-preview .at-library-drop small{display:none}#app-transfer-preview .at-library-foot{display:none}#app-transfer-preview .at-section-label{padding-top:10px}#app-transfer-preview .at-library-heading{padding-bottom:10px}#app-transfer-preview .at-selection{flex-wrap:wrap;padding:10px}#app-transfer-preview .at-selection-copy{width:calc(100% - 44px)}#app-transfer-preview .at-action{flex:1;font-size:10px}#app-transfer-preview .at-action svg{display:none}#app-transfer-preview .at-queue-summary{display:none}#app-transfer-preview .at-task{grid-template-columns:1fr 1fr 22px;gap:7px}#app-transfer-preview .at-task-route{grid-column:1;grid-row:auto;font-size:9px}#app-transfer-preview .at-task-state{grid-column:2;grid-row:1/3}#app-transfer-preview .at-task>.at-icon-button{grid-column:3;grid-row:1/3}#app-transfer-preview .at-task-app{grid-column:1;grid-row:1}#app-transfer-preview .at-footer{flex-wrap:wrap;font-size:9px}#app-transfer-preview .at-foot-status{display:none}#app-transfer-preview .at-footer>div{justify-content:space-between;width:100%}}
@media(prefers-reduced-motion:reduce){#app-transfer-preview .at-devices{scroll-behavior:auto}#app-transfer-preview .at-progress span{transition:none}}
</style>
<script>
(()=>{
const root=document.getElementById('app-transfer-preview');
const $=(s)=>root.querySelector(s), $$=(s)=>Array.from(root.querySelectorAll(s));
const icons=()=>{if(globalThis.lucide)globalThis.lucide.createIcons({attrs:{width:16,height:16}})};
const I=(name,cls='')=>`<i data-lucide="${name}" class="${cls}" aria-hidden="true"></i>`;
const esc=(s)=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const apps={
 avito:{name:'Авито',version:'200.5',size:174,icon:'avito',glyph:'',account:'angelina@example.com'},
 tbank:{name:'Т-Банк',version:'6.13.6',size:288,icon:'tbank',glyph:'Т',account:'Сторонний Apple Account'},
 yplaces:{name:'YPLACES',version:'1.30.1',size:43,icon:'yplaces',glyph:'y',account:'david@example.com'},
 craftersy:{name:'Craftersy',version:'5.1',size:498,icon:'craftersy',glyph:'c',account:'david@example.com'},
 au:{name:'AU',version:'222.1',size:186,icon:'au',glyph:'au',account:'david@example.com'},
 online:{name:'Online',version:'16.0.0',size:421,icon:'online',glyph:'S',account:'Сторонний Apple Account'},
 advance:{name:'Advance',version:'1.2',size:286,icon:'advance',glyph:'a',account:'david@example.com'},
 mail:{name:'Mail App',version:'15.92.0',size:112,icon:'mail',glyph:'@',account:'angelina@example.com'},
 telegram:{name:'Telegram',version:'12.0',size:156,icon:'telegram',lucide:'send',account:'david@example.com'},
 whatsapp:{name:'WhatsApp',version:'25.28',size:218,icon:'whatsapp',lucide:'phone',account:'david@example.com'},
 youtube:{name:'YouTube',version:'20.40',size:192,icon:'youtube',lucide:'play',account:'david@example.com'},
 spotify:{name:'Spotify',version:'9.0',size:165,icon:'spotify',lucide:'audio-lines',account:'david@example.com'}
};
const phones=[{id:'p14',model:'iPhone 14 Pro Max',short:'iPhone 14',owner:'Ангелина',ios:'27.0.1',free:'64 ГБ',number:'14'}, {id:'p16',model:'iPhone 16 Pro Max',short:'iPhone 16',owner:'Давид',ios:'18.5',free:'128 ГБ',number:'16'}, {id:'p17',model:'iPhone 17 Pro Max',short:'iPhone 17',owner:'Ангелина',ios:'27.0.1',free:'204 ГБ',number:'17'}];
let installed,library,tasks,selected,paused=true,timer=null,serial=3,filters={},newApps={},toastTimer,drag=null,queueOpen=true,tab='devices',libraryVisible=true,history=[];
const settings={appearance:'system',density:'comfortable'};
const shortName=(id)=>id==='library'?'Библиотека':phones.find(p=>p.id===id)?.short||id;
function icon(id){const a=apps[id];return `<span class="at-icon at-icon-${a.icon}" aria-hidden="true">${a.icon==='avito'?'<b></b><b></b><b></b><b></b>':a.lucide?I(a.lucide):a.glyph}</span>`}
function row(id,place){const a=apps[id],isNew=newApps[place]?.includes(id),isSelected=selected?.id===id&&selected.place===place;let meta=place==='library'?`${a.version} · ${a.size} МБ`:`${a.version}${isNew?' · Только что установлено':''}`;return `<button type="button" class="at-app-row${isSelected?' is-selected':''}${isNew?' is-new':''}" draggable="true" data-app="${id}" data-place="${place}" aria-pressed="${isSelected}">${icon(id)}<span class="at-app-copy"><span class="at-app-name">${a.name}</span><span class="at-app-meta">${meta}</span></span>${place==='library'||isNew?I('check','at-status-icon'):''}</button>`}
function device(p){return `<section class="at-device" data-drop="${p.id}" data-device="${p.id}" aria-label="${p.model}, ${p.owner}"><div class="at-device-header"><div class="at-phone-icon" aria-hidden="true"><span>${p.number}</span></div><div><h2>${p.model}</h2><span class="at-device-owner">${p.owner} · iOS ${p.ios}</span></div><span class="at-usb"><b></b>USB</span></div><label class="at-search">${I('search')}<input aria-label="Поиск на ${p.model}" placeholder="Найти приложение" data-search="${p.id}"></label><div class="at-device-summary"><span data-counter="${p.id}"></span><span>Свободно ${p.free}</span></div><div data-list="${p.id}"></div><div class="at-device-foot">${I('move-horizontal')}<span>Перетаскивайте между колонками</span></div></section>`}
function renderLists(){phones.forEach(p=>{const items=installed[p.id].filter(id=>apps[id].name.toLowerCase().includes((filters[p.id]||'').toLowerCase()));$(`[data-list="${p.id}"]`).innerHTML=items.map(id=>row(id,p.id)).join('')||'<div class="at-empty">Ничего не найдено</div>';$(`[data-counter="${p.id}"]`).textContent=`${installed[p.id].length} приложений`;});const items=library.filter(id=>apps[id].name.toLowerCase().includes((filters.library||'').toLowerCase()));$('.at-library-list').innerHTML=items.map(id=>row(id,'library')).join('')||'<div class="at-empty">Ничего не найдено</div>';$('.at-library-total').textContent=`${library.length} IPA · ${Math.round(library.reduce((n,id)=>n+apps[id].size,0))} МБ`;icons();}
function renderSelection(){const a=apps[selected.id];const targets=phones.filter(p=>p.id!==selected.place);$('.at-selection').innerHTML=`${icon(selected.id)}<div class="at-selection-copy"><strong>${a.name} <span>· ${a.version}</span></strong><span>${shortName(selected.place)}${selected.place==='library'?' · '+a.account:''}</span></div>${selected.place!=='library'?`<button type="button" class="at-action" data-send="library" ${library.includes(selected.id)?'disabled':''}>${I('download')}${library.includes(selected.id)?'В библиотеке':'В библиотеку'}</button>`:''}${targets.map((p,i)=>`<button type="button" class="at-action ${i===targets.length-1?'primary':''}" data-send="${p.id}" ${installed[p.id].includes(selected.id)?'disabled':''}>${I('arrow-right')}На ${p.short}</button>`).join('')}`;icons();}
function taskState(t){if(t.status==='done')return t.dest==='library'?'Сохранено в библиотеку':'Установлено';if(t.status==='canceled')return 'Отменено';if(t.status==='error')return 'Нужен другой Apple Account';if(t.status==='waiting')return 'В очереди';return ['Скачивание','Проверка IPA','Установка','Проверка на устройстве'][t.stage];}
function renderQueue(){const pending=tasks.filter(t=>['active','waiting'].includes(t.status)),done=tasks.filter(t=>t.status==='done');$('.at-queue-count').textContent=String(pending.length||done.length);$('.at-queue-summary').textContent=pending.length?paused?'Приостановлено':'Выполняется последовательно':`${done.length} завершено`;const play=$('[data-action="play"]');play.innerHTML=I(paused?'play':'pause')+(paused?'Продолжить':'Пауза');play.disabled=!pending.length;$('.at-queue-list').hidden=!queueOpen;$('.at-queue-list').innerHTML=tasks.slice(-5).map(t=>`<div class="at-task ${t.status}"><div class="at-task-app">${icon(t.app)}<strong>${apps[t.app].name}</strong></div><div class="at-task-route"><span>${shortName(t.source)}</span>${I('arrow-right')}<span>${shortName(t.dest)}</span></div><div class="at-task-state"><div class="at-stage-title"><span>${taskState(t)}</span>${t.status==='active'?`<span>${Math.round(t.progress)}%</span>`:''}</div>${t.status==='active'?`<div class="at-progress" role="progressbar" aria-label="${apps[t.app].name}: ${taskState(t)}" aria-valuemin="0" aria-valuemax="100" aria-valuenow="${Math.round(t.progress)}"><span style="width:${t.progress}%"></span></div>`:''}</div>${['active','waiting'].includes(t.status)?`<button type="button" class="at-icon-button" aria-label="Отменить ${apps[t.app].name}" data-cancel="${t.id}">${I('x')}</button>`:I(t.status==='done'?'check':t.status==='error'?'circle-alert':'minus')}</div>`).join('');icons();}
function renderHistory(){$('.at-history').innerHTML=`<h2>Журнал действий</h2><p>Приложения, устройства и аккаунты, использованные для переноса.</p>${history.length?history.slice().reverse().map(h=>`<div class="at-history-row">${icon(h.app)}<div><strong>${apps[h.app].name} · ${apps[h.app].version}</strong><p>${shortName(h.source)} → ${shortName(h.dest)} · ${h.result}</p><p>${apps[h.app].account}</p></div><span>${h.time}</span></div>`).join(''):'<div class="at-empty">Здесь появятся выполненные действия</div>'}`;icons();}
function toast(s){$('.at-toast').textContent=s;$('.at-toast').hidden=false;clearTimeout(toastTimer);toastTimer=setTimeout(()=>$('.at-toast').hidden=true,3200);}
function save(){if(window.openai?.setWidgetState)window.openai.setWidgetState({modelContent:{prototype:'iPhone App Transfer',libraryVisible,selectedApp:apps[selected.id].name,selectedDevice:shortName(selected.place)},privateContent:{libraryVisible,appearance:settings.appearance,density:settings.density}}).catch(()=>{});}
function setLibrary(visible,persist=true){libraryVisible=visible;$('.at-library').hidden=!visible;const b=$('[data-action="library"]');b.setAttribute('aria-expanded',String(visible));b.setAttribute('aria-label',visible?'Скрыть библиотеку':'Показать библиотеку');if(persist)save();}
function setTab(next){tab=next;$('.at-devices').hidden=tab!=='devices';$('.at-history').hidden=tab!=='history';$$('[data-tab]').forEach(b=>b.classList.toggle('is-active',b.dataset.tab===tab));if(tab==='history')renderHistory();}
function cache(id){if(!library.includes(id)){library.push(id);renderLists();}}
function finish(t){t.status='done';t.progress=100;if(t.dest!=='library'){if(!installed[t.dest].includes(t.app))installed[t.dest].unshift(t.app);(newApps[t.dest]??=[]).push(t.app);}history.push({app:t.app,source:t.source,dest:t.dest,result:taskState(t),time:new Date().toLocaleTimeString('ru-RU',{hour:'2-digit',minute:'2-digit'})});renderLists();renderSelection();if(tab==='history')renderHistory();toast(`${apps[t.app].name}: ${t.dest==='library'?'сохранено в библиотеку':'установлено на '+shortName(t.dest)}`);}
function tick(){if(paused)return;let t=tasks.find(t=>t.status==='active');if(!t){t=tasks.find(t=>t.status==='waiting');if(!t){paused=true;clearInterval(timer);timer=null;renderQueue();return;}t.status='active';t.stage=library.includes(t.app)?2:0;t.progress=0;}t.progress=Math.min(100,t.progress+(t.stage===0?8:t.stage===1?34:t.stage===2?13:50));if(t.progress>=100){if(t.stage===0){t.stage=1;t.progress=0;}else if(t.stage===1){cache(t.app);if(t.dest==='library')finish(t);else{t.stage=2;t.progress=0;}}else if(t.stage===2){t.stage=3;t.progress=0;}else finish(t);}renderQueue();}
function resume(){paused=false;if(!timer)timer=setInterval(tick,300);renderQueue();}
function enqueue(id,source,dest){if(source===dest)return;if(dest==='library'&&library.includes(id)){toast(`${apps[id].name} уже есть в библиотеке`);return;}if(dest!=='library'&&installed[dest].includes(id)){toast(`${apps[id].name} уже установлено на ${shortName(dest)}`);return;}if(tasks.some(t=>t.app===id&&t.dest===dest&&['waiting','active'].includes(t.status))){toast('Это приложение уже в очереди');return;}const t={id:++serial,app:id,source,dest,status:'waiting',stage:0,progress:0};if(['tbank','online'].includes(id)){t.status='error';history.push({app:id,source,dest,result:'Нет доступа к аккаунту покупки',time:new Date().toLocaleTimeString('ru-RU',{hour:'2-digit',minute:'2-digit'})});toast('Нужен Apple Account, под которым получено приложение.');}tasks.push(t);if(t.status!=='error')resume();renderQueue();save();}
function reset(){clearInterval(timer);timer=null;paused=true;serial=3;filters={};newApps={};installed={p14:['avito','tbank','yplaces','telegram','whatsapp','youtube','spotify'],p16:['craftersy','au','online','advance','mail','telegram','spotify'],p17:['avito','mail','telegram','whatsapp']};library=['avito','mail'];selected={id:'craftersy',place:'p16'};tasks=[{id:1,app:'craftersy',source:'p16',dest:'p17',status:'active',stage:0,progress:42},{id:2,app:'yplaces',source:'p14',dest:'library',status:'waiting',stage:0,progress:0},{id:3,app:'advance',source:'p16',dest:'p17',status:'waiting',stage:0,progress:0}];history=[{app:'avito',source:'p14',dest:'p17',result:'Установлено',time:'14:21'},{app:'mail',source:'library',dest:'p17',result:'Установлено',time:'14:22'}];$('.at-devices').innerHTML=phones.map(device).join('');$('[data-search="library"]').value='';renderLists();renderSelection();renderQueue();renderHistory();}
root.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;if(b.dataset.app){selected={id:b.dataset.app,place:b.dataset.place};renderLists();renderSelection();save();return;}if(b.dataset.send){enqueue(selected.id,selected.place,b.dataset.send);return;}if(b.dataset.tab){setTab(b.dataset.tab);return;}if(b.dataset.jump){setTab('devices');const pane=$(`[data-device="${b.dataset.jump}"]`),scroller=$('.at-devices');scroller.scrollTo({left:pane.offsetLeft-scroller.offsetLeft,behavior:'smooth'});return;}if(b.dataset.cancel){const t=tasks.find(t=>t.id===Number(b.dataset.cancel));t.status='canceled';renderQueue();return;}switch(b.dataset.action){case'library':setLibrary(!libraryVisible);break;case'play':if(paused)resume();else{paused=true;renderQueue();}break;case'queue':queueOpen=!queueOpen;b.setAttribute('aria-expanded',String(queueOpen));renderQueue();break;case'accounts':$('.at-account-popover').hidden=!$('.at-account-popover').hidden;break;case'close-accounts':$('.at-account-popover').hidden=true;break;case'reset':reset();setTab('devices');toast('Пример возвращён к началу');break;}});
root.addEventListener('input',e=>{if(e.target.dataset.search){filters[e.target.dataset.search]=e.target.value;renderLists();}});
document.addEventListener('keydown',e=>{if((e.metaKey||e.ctrlKey)&&e.key.toLowerCase()==='s'){e.preventDefault();setLibrary(!libraryVisible);}if(e.key==='Escape'){$('.at-account-popover').hidden=true;clearDrag();}});
function clearDrag(){drag=null;$$('.at-drop-overlay').forEach(el=>el.remove());$$('.is-drop-hover,.is-dragged').forEach(el=>el.classList.remove('is-drop-hover','is-dragged'));}
root.addEventListener('dragstart',e=>{const row=e.target.closest('[data-app]');if(!row)return;drag={id:row.dataset.app,source:row.dataset.place};e.dataTransfer.setData('text/plain',JSON.stringify(drag));e.dataTransfer.effectAllowed='copy';row.classList.add('is-dragged');});
root.addEventListener('dragover',e=>{if(!drag)return;const toggle=e.target.closest('[data-action="library"]');if(toggle){e.preventDefault();setLibrary(true,false);return;}const area=e.target.closest('[data-drop]');if(!area||area.dataset.drop===drag.source)return;e.preventDefault();e.dataTransfer.dropEffect='copy';$$('.at-drop-overlay').forEach(el=>{if(el.parentElement!==area)el.remove();});$$('.is-drop-hover').forEach(el=>{if(el!==area)el.classList.remove('is-drop-hover');});if(area.dataset.drop==='library')area.classList.add('is-drop-hover');else if(!area.querySelector('.at-drop-overlay')){const o=document.createElement('div');o.className='at-drop-overlay';o.innerHTML=`${I('arrow-down-to-line')}<strong>Установить ${apps[drag.id].name}</strong><small>На ${phones.find(p=>p.id===area.dataset.drop).model}</small><small>${library.includes(drag.id)?'Из библиотеки':'Сначала скачаем в библиотеку'}</small>`;area.appendChild(o);icons();}const scroller=$('.at-devices'),r=scroller.getBoundingClientRect();if(e.clientX>r.right-45)scroller.scrollLeft+=18;if(e.clientX<r.left+45)scroller.scrollLeft-=18;});
root.addEventListener('dragleave',e=>{const area=e.target.closest('[data-drop]');if(area&&!area.contains(e.relatedTarget)){area.querySelector('.at-drop-overlay')?.remove();area.classList.remove('is-drop-hover');}});
root.addEventListener('drop',e=>{if(!drag)return;const area=e.target.closest('[data-drop]'),toggle=e.target.closest('[data-action="library"]');if(!area&&!toggle)return;e.preventDefault();const d={...drag},dest=area?.dataset.drop||'library';clearDrag();enqueue(d.id,d.source,dest);});
root.addEventListener('dragend',clearDrag);
$('.at-account-popover').innerHTML=`<div class="at-popover-head"><span>Apple Accounts</span><button type="button" class="at-icon-button" data-action="close-accounts" aria-label="Закрыть">${I('x')}</button></div>${['david@example.com','angelina@example.com'].map(email=>`<div class="at-account-row">${I('circle-user-round')}<div><strong>${email}</strong><small>Вход выполнен · пример</small></div></div>`).join('')}`;
function applyDesign(){root.style.colorScheme=settings.appearance==='system'?'light dark':settings.appearance;root.style.setProperty('--at-row-height',settings.density==='compact'?'49px':'57px');}
function restore(s){const p=s?.privateContent;if(!p)return;if(typeof p.libraryVisible==='boolean')setLibrary(p.libraryVisible,false);if(['system','light','dark'].includes(p.appearance))settings.appearance=p.appearance;if(['comfortable','compact'].includes(p.density))settings.density=p.density;applyDesign();}
reset();restore(window.openai?.widgetState);window.addEventListener('openai:set_globals',e=>restore(e.detail?.globals?.widgetState));
if(globalThis.Tweak){const tweak=new Tweak({container:root,onChange:()=>{applyDesign();save();}});tweak.addSelect(settings,'appearance',{label:'Оформление',options:[{label:'По системе',value:'system'},{label:'Тёмное',value:'dark'},{label:'Светлое',value:'light'}]});tweak.addSelect(settings,'density',{label:'Плотность списка',options:[{label:'Обычная',value:'comfortable'},{label:'Компактная',value:'compact'}]});}
})();
</script>
